name: Template Validation

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use_drf: ["y", "n"]

    name: use_drf=${{ matrix.use_drf }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Cookiecutter
        run: uv tool install cookiecutter

      - name: Generate project
        run: cookiecutter . --no-input use_drf=${{ matrix.use_drf }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --config my-django-project/.pre-commit-config.yaml

      - name: Build Docker image
        working-directory: my-django-project
        run: |
          docker build --target development -t backend:test .

      - name: Run tests
        working-directory: my-django-project
        run: |
          docker compose -f docker-compose.test.yml run --rm test